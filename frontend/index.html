<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .container h1 {
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            padding: 25px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>My Dashboard</h2>
        <button class="logout">Logout</button>
    </div>

    <div class="container">

        <h1>Welcome, Abhishek!</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <p>120</p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p>75</p>
            </div>

            <div class="card">
                <h3>Products</h3>
                <p>45</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>₹25,000</p>
            </div>

        </div>

    </div>

</body>
</html>
